[project]
name = "superpowering-agents"
version = "0.1.0"
description = "RAG pipeline for design-reference-driven Next.js code generation"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.42.0",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "mcp>=1.0.0",
    "playwright>=1.40.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
